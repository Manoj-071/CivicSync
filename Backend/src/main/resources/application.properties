spring.application.name=CivicSync_Backend
# 🔌 Server Port Config (Runs your Java API on port 8080)
server.port=8080

# 🗄️ Database Connection URL String
spring.datasource.url=jdbc:postgresql://localhost:5432/civic_sync_db
spring.datasource.username=postgres
spring.datasource.password=li@17

# 🏗️ Hibernate & JPA Engines Strategy
# "update" tells Spring to automatically create tables/columns if they are missing
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# 📜 Debugging: Show the active SQL queries inside IntelliJ's console terminal
spring.jpa.show-sql=true